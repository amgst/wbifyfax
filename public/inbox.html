<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaxBridge inbox</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="wrap"><section class="info"><a href="/">FaxBridge</a><h1>Received faxes</h1><p>Enter your private inbox access token. It stays in this page's memory until you close or reload it.</p><form id="unlock"><label for="token">Inbox access token</label><input id="token" type="password" autocomplete="off" required minlength="32"><button class="btn" type="submit">Open inbox</button><button class="outline" type="button" id="lock">Lock inbox</button></form><p id="notice" role="status"></p><div class="table-wrap"><table><thead><tr><th>FROM</th><th>TO</th><th>RECEIVED</th><th>PAGES</th><th>DOCUMENT</th></tr></thead><tbody id="faxes"></tbody></table></div></section></main><script src="/inbox.js"></script></body></html>
